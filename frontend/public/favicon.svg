<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Ícone do Caminhão de Transporte / Fretes -->
  <g filter="url(#shadow)" transform="translate(8, 12)">
    <!-- Carroceria / Baú da Carreta -->
    <rect x="2" y="6" width="28" height="22" rx="3" fill="url(#truckGrad)" />
    
    <!-- Detalhe da Carroceria -->
    <path d="M7 11h18M7 17h18M7 23h18" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

    <!-- Cabine do Cavalo Mecânico -->
    <path d="M30 14h8a4 4 0 0 1 3.2 1.6l4 5.4a2 2 0 0 1 .4 1.2V26a2 2 0 0 1-2 2h-13.6V14z" fill="url(#truckGrad)" />
    
    <!-- Janela / Pára-brisa da Cabine -->
    <path d="M33 17h4.8l3.2 4.5a1 1 0 0 1 .2.6V23H33v-6z" fill="#0f172a" opacity="0.75" />

    <!-- Farol Dianteiro -->
    <rect x="43.5" y="24" width="2" height="2.5" rx="0.5" fill="#facc15" />

    <!-- Rodas -->
    <!-- Roda Traseira 1 -->
    <circle cx="8" cy="29" r="4.5" fill="#0f172a" />
    <circle cx="8" cy="29" r="2" fill="#94a3b8" />

    <!-- Roda Traseira 2 -->
    <circle cx="21" cy="29" r="4.5" fill="#0f172a" />
    <circle cx="21" cy="29" r="2" fill="#94a3b8" />

    <!-- Roda Dianteira -->
    <circle cx="39" cy="29" r="4.5" fill="#0f172a" />
    <circle cx="39" cy="29" r="2" fill="#94a3b8" />
  </g>

  <!-- Pista / Linha de Asfalto -->
  <path d="M8 48h48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35" />
</svg>